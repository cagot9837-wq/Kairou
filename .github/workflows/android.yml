
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false

      - name: Aceitar licenças e instalar SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK não encontrado."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "::error::Arquivo settings.gradle não encontrado."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "::error::Configuração do módulo app não encontrada."
            exit 1
          fi

          if [ ! -f gradlew ]; then
            echo "::error::Gradle Wrapper gradlew não encontrado."
            exit 1
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::APK não foi gerado."
            find . -type f -name '*.apk' -print || true
            exit 1
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kairou-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
