name: Gerar APK Android

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-apk:
    name: Criar projeto e compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android necessários
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar projeto Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/example/pooltrajectory

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'PoolTrajectory'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          PROPS

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.pooltrajectory'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.pooltrajectory'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Pool Trajectory"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > app/src/main/java/com/example/pooltrajectory/MainActivity.kt <<'KOTLIN'
          package com.example.pooltrajectory

          import android.app.Activity
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.sin

          class MainActivity : Activity() {
              private lateinit var distanceInput: EditText
              private lateinit var angleInput: EditText
              private lateinit var tableView: TableView
              private lateinit var output: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      setBackgroundColor(Color.rgb(16, 37, 32))
                  }

                  layout.addView(TextView(this).apply {
                      text = "Pool Trajectory"
                      textSize = 26f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                  }, matchWrap())

                  layout.addView(TextView(this).apply {
                      text = "Calculadora de trajetória offline"
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setTextColor(Color.LTGRAY)
                      setPadding(0, dp(4), 0, dp(12))
                  }, matchWrap())

                  distanceInput = makeInput("Distância (1 a 100)")
                  angleInput = makeInput("Ângulo em graus (0 a 359)")
                  layout.addView(distanceInput, matchWrap())
                  layout.addView(angleInput, matchWrap())

                  layout.addView(Button(this).apply {
                      text = "Calcular trajetória"
                      setOnClickListener { calculate() }
                  }, matchWrap())

                  tableView = TableView()
                  layout.addView(tableView, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f
                  ))

                  output = TextView(this).apply {
                      text = "Informe distância e ângulo."
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setPadding(0, dp(8), 0, 0)
                  }
                  layout.addView(output, matchWrap())

                  layout.addView(TextView(this).apply {
                      text = "Estimativa manual. Não se conecta ao jogo nem altera sua memória."
                      textSize = 12f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, dp(8), 0, 0)
                  }, matchWrap())

                  setContentView(layout)
              }

              private fun makeInput(hintText: String) = EditText(this).apply {
                  hint = hintText
                  setTextColor(Color.WHITE)
                  setHintTextColor(Color.LTGRAY)
                  inputType = InputType.TYPE_CLASS_NUMBER or
                      InputType.TYPE_NUMBER_FLAG_DECIMAL or
                      InputType.TYPE_NUMBER_FLAG_SIGNED
                  singleLine = true
              }

              private fun calculate() {
                  val distance = distanceInput.text.toString().toFloatOrNull()
                  val angle = angleInput.text.toString().toFloatOrNull()
                  if (distance == null || angle == null || distance !in 1f..100f || angle !in 0f..359f) {
                      output.text = "Entrada inválida. Use distância 1–100 e ângulo 0–359."
                      return
                  }

                  tableView.distanceRatio = distance / 100f
                  tableView.angleDegrees = angle
                  tableView.invalidate()

                  val radians = angle * PI / 180.0
                  output.text = "Deslocamento estimado: X = %.1f | Y = %.1f | Ângulo = %.1f°"
                      .format(distance * cos(radians), distance * sin(radians), angle)
              }

              private fun dp(value: Int) = (value * resources.displayMetrics.density).toInt()

              private fun matchWrap() = LinearLayout.LayoutParams(
                  LinearLayout.LayoutParams.MATCH_PARENT,
                  LinearLayout.LayoutParams.WRAP_CONTENT
              )

              private inner class TableView : View(this@MainActivity) {
                  var distanceRatio = 0.65f
                  var angleDegrees = 25f
                  private val felt = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val aimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.rgb(255, 225, 100)
                      strokeWidth = dp(3).toFloat()
                      style = Paint.Style.STROKE
                  }
                  private val whiteBall = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
                  private val pocketPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(5, 15, 12) }
                  private val targetBall = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(245, 190, 50) }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val pad = dp(14).toFloat()
                      val left = pad
                      val top = pad
                      val right = width - pad
                      val bottom = height - pad
                      felt.color = Color.rgb(22, 112, 75)
                      canvas.drawRoundRect(left, top, right, bottom, dp(12).toFloat(), dp(12).toFloat(), felt)

                      val pocketRadius = dp(8).toFloat()
                      val pockets = listOf(
                          left to top, (left + right) / 2f to top, right to top,
                          left to bottom, (left + right) / 2f to bottom, right to bottom
                      )
                      pockets.forEach { canvas.drawCircle(it.first, it.second, pocketRadius, pocketPaint) }

                      val startX = left + (right - left) * 0.25f
                      val startY = top + (bottom - top) * 0.65f
                      val length = (right - left) * distanceRatio.coerceIn(0.05f, 1f) * 0.8f
                      val radians = angleDegrees * PI / 180.0
                      val endX = (startX + cos(radians).toFloat() * length)
                          .coerceIn(left + pocketRadius, right - pocketRadius)
                      val endY = (startY - sin(radians).toFloat() * length)
                          .coerceIn(top + pocketRadius, bottom - pocketRadius)

                      canvas.drawLine(startX, startY, endX, endY, aimPaint)
                      canvas.drawCircle(startX, startY, dp(7).toFloat(), whiteBall)
                      canvas.drawCircle(endX, endY, dp(6).toFloat(), targetBall)
                  }
              }
          }
          KOTLIN

      - name: Compilar APK de depuração
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verificar se o APK foi criado
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: pool-trajectory-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Salvar relatórios se houver falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
